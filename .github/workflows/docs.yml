# Publishes the project website to GitHub Pages: the landing page in site/ at the root and the
# help pages in docs/ under /docs/ (the app's F1 opens https://<owner>.github.io/<repo>/docs/).
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R docs _site/docs
          rm -f _site/copy.md
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # the new artifact sometimes isn't listed yet right after the upload
      - name: Wait for the artifact to be listed
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v5
