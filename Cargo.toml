[package]
name = "arbor_studio"
version = "0.3.0"
edition = "2021"
description = "Procedural tree modeller with a built-in MCP server for coding agents"
license = "MIT"
readme = "README.md"
keywords = ["tree", "procedural", "3d", "gltf", "mcp"]
categories = ["graphics", "game-development"]

[[bin]]
name = "arbor_studio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
rfd = "0.17"

[target.'cfg(windows)'.build-dependencies]
# the program icon inside arbor_studio.exe
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
# the menus in the macOS menu bar
muda = { version = "0.17", default-features = false }
# grey path labels under the entries of File > Open Recent
objc2 = "0.6"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
